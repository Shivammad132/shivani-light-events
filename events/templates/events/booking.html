{% extends 'events/base.html' %}

{% block title %} Book Your Event | Shivani Light & Events {% endblock %}

{% block content %}
<section class="booking-section">

    <div class="section-heading">

        <p>LET'S PLAN YOUR EVENT</p>
        <h1>Book Your <span>Event</span></h1>

        <div class="heading-line"></div>

        <p class="section-description">
            Tell us about your event and
            we'll get back to you shortly.
        </p>
    </div>
    <form
        method="POST" class="booking-form">
        {% csrf_token %}
        <div class="form-group">
            <label>
                Full Name
            </label>
            <input type="text" name="name" placeholder="Enter your name" required>
        </div>
        <div class="form-group">
            <label>Mobile Number</label>
            <input type="tel" name="phone" placeholder="Enter mobile number" maxlength="15" required >

        </div>
        <div class="form-group">
            <label>
                Event Type
            </label>
            <select name="event_type" required >
                <option value="">Select event type</option>
                <option value="Wedding">Wedding</option>
                <option value="Birthday / Party">Birthday / Party</option>
                <option value="Engagement">Engagement</option>
                <option value="Haldi / Mehndi">Haldi / Mehndi</option>
                <option value="Corporate Event">Corporate Event</option>
                <option value="Dulha Rath and Roadlight">Dulha Rath and Roadlight</option>
                <option value="Pickup Rental">Pickup Rental</option>
                <option value="Other">Other</option>
            </select>
        </div>
        <div class="form-group">
            <label> Event Date</label>
            <input type="date" name="event_date" required >
        </div>
        <div class="form-group full">

            <label>
                Venue / Location
            </label>

            <input type="text" name="location" placeholder="Enter venue or location" >

        </div>
        <div class="form-group full">

            <label>
                Requirements
            </label>

            <textarea
                name="requirements"
                rows="6"
                placeholder="Tell us about your decoration, lighting, DJ, stage requirements..."
            ></textarea>

        </div>
        <button type="submit" class="btn btn-gold booking-submit">
            Send Enquiry <b><strong>✓</strong></b>
        </button>
    </form>
</section>

{% endblock %}
