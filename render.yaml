services:
  - type: web
    name: shivani-light-events
    runtime: python
    plan: free

    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate && python manage.py shell -c "import os; from django.contrib.auth import get_user_model; U=get_user_model(); u=U.objects.filter(username=os.environ['DJANGO_SUPERUSER_USERNAME']).first(); u=U.objects.create_superuser(os.environ['DJANGO_SUPERUSER_USERNAME'], os.environ['DJANGO_SUPERUSER_EMAIL'], os.environ['DJANGO_SUPERUSER_PASSWORD']) if not u else u; print('Admin ready:', u.username)"

    startCommand: gunicorn shivani_lights.wsgi:application

    envVars:
      - key: SECRET_KEY
        sync: false

      - key: DEBUG
        value: "False"

      - key: DATABASE_URL
        fromDatabase:
          name: shivani-light-events-db
          property: connectionString

      - key: DJANGO_SUPERUSER_USERNAME
        value: admin

      - key: DJANGO_SUPERUSER_EMAIL
        value: admin@gmail.com

      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false

databases:
  - name: shivani-light-events-db
    plan: free
    region: singapore